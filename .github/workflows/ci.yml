# The suite is offline by design: no model server, no network, no ffmpeg. That is what makes
# this workflow a real check rather than a smoke test -- it runs the same command a
# contributor runs, on Pythons and an operating system I do not have.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch that is pushed and then opened as a pull request triggers twice, and the second
# run tells you nothing the first did not. Superseded runs are cancelled rather than queued:
# the answer wanted is about the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} - python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # The suite runs offline in about a minute. Ten is generous for a cold runner and still
    # ends a job that has hung on a network wait rather than leaving it to the six-hour
    # default -- the same reasoning as `fetch_timeout_seconds`: bound a hang, do not be tight.
    timeout-minutes: 10
    strategy:
      # Never stop the other jobs: a failure on one Python is most informative beside the
      # versions that passed.
      fail-fast: false
      matrix:
        # EVERY version the classifiers advertise. Testing only the floor and the newest
        # left 3.11 and 3.12 claimed to strangers reading the package listing and never
        # executed -- a claim is backed or it is not made, and
        # `test_it_tests_every_python_the_classifiers_advertise` now holds the two together.
        # Windows is where this was written, so Linux is the half that had never run it.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pyflakes
        # Undefined names in files no test imports. The suite shells out to this too, but a
        # missing pyflakes there degrades the check into a SKIP, so it runs here as a step
        # of its own where absence is a failure.
        run: python -m pyflakes winnow tests scripts experiments

      - name: Tests
        run: python -m pytest tests/ -q

  build:
    name: build and check metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          # Pinned, because an unpinned build tool means the packaging check can start
          # failing on a day nothing here changed. Versions read from PyPI on 2026-09-09,
          # not recalled -- raise them deliberately, and this comment says when they were
          # last looked at.
          pip install "build==1.6.0" "twine==7.0.0"
          python -m build

      - name: Check the metadata a listing page would show
        run: python -m twine check dist/*
