[project]
name = "winnow"
version = "0.1.0"
description = "Give it a YouTube link; it tells you what the video says that you do not already know."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
winnow = "winnow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyflakes>=3.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["winnow*"]
